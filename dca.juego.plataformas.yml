id: dca.juego.plataformas
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: proyectoDCA
finish-args:
  - --socket=x11 # Permisos de OpenGL para renderizado
  - --socket=pulseaudio # Permisos de audio
modules:
  - name: raylib
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_EXAMPLES=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz
        sha256: aea98ecf5bc5c5e0b789a76de0083a21a70457050ea4cc2aec7566935f5e258e
  - name: proyectoDCA
    buildsystem: simple
    build-commands:
      - make install
      - install -d /app/share/proyectoDCA
      - cp -r assets /app/share/proyectoDCA/assets
    sources:
      - type: dir
        path: "."
